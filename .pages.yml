# Admin of the website: https://app.pagescms.org (sign in with GitHub).
# Each field below edits site.json; saving publishes okaisse.com in about a minute.
# Generated from the page texts; keep keys in sync with data-i18n in index.html.
media:
  input: images
  output: images
content:
  - name: site
    label: Réglages du site
    type: file
    path: site.json
    format: json
    fields:
      - name: whatsapp
        label: Numéro WhatsApp
        description: "Format international, chiffres seulement. Exemple : 212612345678"
        type: string
        required: true
      - name: app_url
        label: Lien du bouton « Se connecter »
        description: "Adresse de l'application pour les boutiques."
        type: string
      - name: trial_url
        label: Lien des boutons « Essai gratuit »
        description: "Page où une boutique crée son compte d'essai. Par défaut https://app.okaisse.com/?signup (ouvre directement « Créer ma boutique »)."
        type: string
      - name: image
        label: Capture d'écran (haut de page)
        description: "Image large, idéalement 1280 x 800."
        type: image
      - name: prix
        label: Prix (MAD)
        type: object
        fields:
          - name: solo
            label: Solo
            type: object
            fields:
              - { name: mois, label: Par mois, type: string }
              - { name: an, label: Par an, type: string }
          - name: boutique
            label: Boutique
            type: object
            fields:
              - { name: mois, label: Par mois, type: string }
              - { name: an, label: Par an, type: string }
          - name: multi
            label: Multi-boutique
            type: object
            fields:
              - { name: mois, label: Par mois, type: string }
              - { name: an, label: Par an, type: string }
      - name: textes
        label: Textes du site
        type: object
        fields:
          - name: menu
            label: "Menu et boutons"
            type: object
            fields:
              - name: nav_features
                label: "Menu : Fonctionnalités"
                type: object
                fields:
                  - { name: fr, label: Français, type: string }
                  - { name: ar, label: Arabe, type: string }
                  - { name: en, label: Anglais, type: string }
              - name: nav_how
                label: "Menu : Comment ça marche"
                type: object
                fields:
                  - { name: fr, label: Français, type: string }
                  - { name: ar, label: Arabe, type: string }
                  - { name: en, label: Anglais, type: string }
              - name: nav_pricing
